name: tests

# The suite is hermetic: every target is a localhost fixture, so nothing here
# ever touches a third party host.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"                     # weekly: the oracle asserts real browser behaviour, which drifts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    # Fast and deterministic: no browser involved, so it can afford to run on
    # every interpreter DSXS claims to support.
    name: suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DSXS_SKIP_ORACLE: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report the environment
        run: |
          python -VV
          openssl version

      - name: Run the regression suite
        run: python -m unittest discover -s tests -v

  oracle:
    # Cross-checks every verdict against a real browser. Environment bound and
    # an order of magnitude slower, so it runs once instead of per interpreter.
    name: browser oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require a headless browser
        # Without one the oracle tests skip themselves, which would quietly
        # turn the build green while dropping most of the suite's value.
        run: >-
          python -c "import sys; sys.path.insert(0, 'tests'); import browser;
          print(browser.version());
          sys.exit(0 if browser.available() else 'refusing to run with the browser oracle disabled')"

      - name: Run the regression suite, oracle included
        run: python -m unittest discover -s tests -v
